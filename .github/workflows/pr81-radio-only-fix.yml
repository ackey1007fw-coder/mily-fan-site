name: PR81 radio-only relation fix

on:
  push:
    branches:
      - cursor/content-2026-08-24-seasidecircle-yes-tokyo-e6e5

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/content-2026-08-24-seasidecircle-yes-tokyo-e6e5
          fetch-depth: 0

      - name: Apply explicit radio-only relation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 occurrence, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'src/data/news.ts',
              '    activityIds: ["radio", "miss-circle"],\n    title: "「Yes!東京」踊ってみた💃",',
              '    activityIds: ["radio"],\n    title: "「Yes!東京」踊ってみた💃",',
          )

          replace_once(
              'scripts/activity-pages.test.mjs',
              '  "2026-08-24-seasidecircle-yes-tokyo": ["radio", "miss-circle"],',
              '  "2026-08-24-seasidecircle-yes-tokyo": ["radio"],',
          )

          replace_once(
              'scripts/seasidecircle-yes-tokyo-20260824.test.mjs',
              '    assert.deepEqual(item()?.activityIds, ["radio", "miss-circle"]);',
              '    assert.deepEqual(item()?.activityIds, ["radio"]);',
          )

          old_block = '''  it("appears once on radio and miss-circle Activities", () => {
    const radioNews = selectActivityNews("radio", news, news.length);
    const missNews = selectActivityNews("miss-circle", news, news.length);
    const radioMedia = selectActivityMedia("radio");
    const missMedia = selectActivityMedia("miss-circle");

    assert.equal(radioNews.filter((entry) => entry.id === NEWS_ID).length, 1);
    assert.equal(missNews.filter((entry) => entry.id === NEWS_ID).length, 1);
    assert.equal(radioNews[0]?.id, NEWS_ID);
    assert.equal(radioMedia[0], seasideCircleYesTokyoVideo);
    assert.equal(
      missMedia.filter((entry) => entry === seasideCircleYesTokyoVideo).length,
      1,
    );
  });'''
          new_block = '''  it("appears once on the radio Activity only", () => {
    const radioNews = selectActivityNews("radio", news, news.length);
    const missNews = selectActivityNews("miss-circle", news, news.length);
    const radioMedia = selectActivityMedia("radio");
    const missMedia = selectActivityMedia("miss-circle");

    assert.equal(radioNews.filter((entry) => entry.id === NEWS_ID).length, 1);
    assert.equal(missNews.filter((entry) => entry.id === NEWS_ID).length, 0);
    assert.equal(radioNews[0]?.id, NEWS_ID);
    assert.equal(radioMedia[0], seasideCircleYesTokyoVideo);
    assert.equal(
      missMedia.filter((entry) => entry === seasideCircleYesTokyoVideo).length,
      0,
    );
  });'''
          replace_once(
              'scripts/seasidecircle-yes-tokyo-20260824.test.mjs',
              old_block,
              new_block,
          )
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/pr81-radio-only-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: keep Yes!Tokyo related only to radio"
          git push origin HEAD:cursor/content-2026-08-24-seasidecircle-yes-tokyo-e6e5
