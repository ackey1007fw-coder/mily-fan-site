name: Patch b39 media inventory

on:
  push:
    branches:
      - feat/paton-vote-day-3-story-20260828
    paths:
      - ".github/workflows/patch-b39-media-inventory.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Insert b39 inventory into docs/MEDIA.md
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("docs/MEDIA.md"); s=p.read_text(encoding="utf-8"); m="## 素材台帳（Fan Room voice / 受領日・source date 2026-08-26）"; h="## 素材台帳（batch b39 / 受領日・source date 2026-08-28）"; b=Path(".tmp/b39-media-inventory.md").read_text(encoding="utf-8"); assert m in s; assert h not in s; p.write_text(s.replace(m, b + "\n" + m, 1), encoding="utf-8")'
          rm -f .tmp/b39-media-inventory.md
          rm -f .github/workflows/patch-b39-media-inventory.yml
          git diff --check

      - name: Commit canonical inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Paton day 3 Story media"
          git push origin "HEAD:${{ github.ref_name }}"
