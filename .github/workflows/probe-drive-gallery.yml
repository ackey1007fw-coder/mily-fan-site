name: Probe Drive gallery ingest

# Drive受領素材のビルド時取り込み（個別ファイル取得 → metadata除去）を
# 実ネットワークで検証するための手動/ブランチ限定ワークフロー。
# サイトのビルドやデプロイには関与せず、公開物も生成しない。
#
# フォルダ一覧は取得しない。登録済みの個別 file id だけを取得する。

on:
  workflow_dispatch:
  push:
    branches: ["feat/drive-gallery-b02", "claude/**"]
    paths:
      - "scripts/probe-drive-gallery.mjs"
      - "scripts/drive-gallery-fetch.mjs"
      - "scripts/drive-gallery-source.mjs"
      - ".github/workflows/probe-drive-gallery.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Fetch and sanitize sample media
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Probe individual Drive downloads and sanitize
        run: node scripts/probe-drive-gallery.mjs

      # 実際の ingest を published 相当で1往復させ、sanitized static media と
      # manifest が生成されることを確認する。出力は使い捨てディレクトリで、
      # リポジトリの manifest も public/ も書き換えない。
      - name: Rehearse the published ingest (throwaway output)
        env:
          DRIVE_GALLERY_STATE: published
          DRIVE_GALLERY_OUTPUT_DIR: ${{ runner.temp }}/drive-gallery-out
          DRIVE_GALLERY_MANIFEST: ${{ runner.temp }}/drive-gallery-manifest.json
          DRIVE_GALLERY_ONLY: mily-drive-b02-p46,mily-drive-b02-v06
        run: |
          set -euo pipefail
          node scripts/build-drive-gallery.mjs
          echo "--- generated manifest ---"
          cat "${DRIVE_GALLERY_MANIFEST}"
          echo "--- generated files ---"
          ls -la "${DRIVE_GALLERY_OUTPUT_DIR}"
          node -e '
            const fs = require("node:fs");
            const m = JSON.parse(fs.readFileSync(process.env.DRIVE_GALLERY_MANIFEST, "utf8"));
            const raw = JSON.stringify(m);
            if (m.items.length !== 2) throw new Error("expected 2 manifest items");
            if (/drive\.google\.com|drive\.usercontent\.google\.com/.test(raw)) {
              throw new Error("manifest references a Drive host");
            }
            if (/"fileId"/.test(raw)) throw new Error("manifest carries a fileId");
            for (const item of m.items) {
              if (!item.src.startsWith("/media/drive-gallery/")) {
                throw new Error(`${item.id} is not a local asset`);
              }
            }
            const files = fs.readdirSync(process.env.DRIVE_GALLERY_OUTPUT_DIR);
            const expected = [
              "mily-b02-p46-480.jpg", "mily-b02-p46-480.webp",
              "mily-b02-p46-960.jpg", "mily-b02-p46-960.webp",
              "mily-b02-p46-1600.jpg", "mily-b02-p46-1600.webp",
              "mily-b02-v06.mp4", "mily-b02-v06-poster.jpg",
            ];
            for (const name of expected) {
              if (!files.includes(name)) throw new Error(`missing derivative ${name}`);
            }
            console.log("ingest rehearsal OK:", files.length, "files");
          '

      # 未公開状態では 1 度もネットワークへ出ないこと。
      - name: Verify the review gate makes no request
        env:
          DRIVE_GALLERY_OUTPUT_DIR: ${{ runner.temp }}/drive-gallery-review
          DRIVE_GALLERY_MANIFEST: ${{ runner.temp }}/drive-gallery-review.json
        run: |
          set -euo pipefail
          node scripts/build-drive-gallery.mjs
          cat "${DRIVE_GALLERY_MANIFEST}"
          test "$(node -p "require('${DRIVE_GALLERY_MANIFEST}').items.length")" = "0"
