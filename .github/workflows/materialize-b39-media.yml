name: Materialize b39 Story media

on:
  push:
    branches:
      - feat/paton-vote-day-3-story-20260828
    paths:
      - ".github/workflows/materialize-b39-media.yml"

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Restore and verify public media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media/gallery

          cat \
            .tmp/b39/video.part.00 \
            .tmp/b39/video.part.01 \
            .tmp/b39/video.part.01b \
            .tmp/b39/video.part.02 \
            .tmp/b39/video.part.03 \
            .tmp/b39/video.part.04 \
            | base64 --decode \
            | xz --decompress \
            > public/media/gallery/mily-b39-01-paton-vote-day-3-story.mp4

          cat \
            .tmp/b39/poster.part.00 \
            .tmp/b39/poster.part.01 \
            .tmp/b39/poster.part.02 \
            | base64 --decode \
            | xz --decompress \
            > public/media/gallery/mily-b39-01-paton-vote-day-3-story-poster.jpg

          test "$(stat -c%s public/media/gallery/mily-b39-01-paton-vote-day-3-story.mp4)" -eq 86843
          test "$(stat -c%s public/media/gallery/mily-b39-01-paton-vote-day-3-story-poster.jpg)" -eq 31464

          echo "d808b91f9b59a2cab14beae1d797a0bb99ec6a84c82a09ec6f7b4fadc5102e19  public/media/gallery/mily-b39-01-paton-vote-day-3-story.mp4" | sha256sum --check
          echo "f6771c8ec93470d4c3036b77e66472d01151a91f421f9816642c159fa1802e38  public/media/gallery/mily-b39-01-paton-vote-day-3-story-poster.jpg" | sha256sum --check

      - name: Remove staging data and commit the final assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .tmp/b39
          rm -f .github/workflows/materialize-b39-media.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Paton vote day 3 Story media"
          git push origin "HEAD:${{ github.ref_name }}"
