name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: PR diff whitespace
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$PR_BASE_SHA...$PR_HEAD_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Previously published morning PNG URL compatibility
        run: node scripts/morning-png-compat.http.mjs

      - name: Site identity guard
        run: pnpm guard

      - name: Install isolated browser test tooling
        timeout-minutes: 8
        run: |
          # Avoid the Azure mirror's slow package downloads; keep Ubuntu's signed archives.
          for source_file in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source_file" ]; then
              sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' "$source_file"
            fi
          done
          npm install --prefix "$RUNNER_TEMP/mily-browser-tools" --no-package-lock --ignore-scripts --no-audit --no-fund playwright@1.61.1
          node "$RUNNER_TEMP/mily-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium webkit

      - name: October 8 announced stream schedule browser checks
        timeout-minutes: 5
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/announced-stream-20261008.browser.mjs

      - name: Ad reward beginner guide browser checks
        timeout-minutes: 3
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          AD_REWARD_ROOM_URL: https://www.showroom-live.com/r/circle2026_0734
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ad-reward.browser.mjs

      - name: Fanroom board photo browser checks
        timeout-minutes: 3
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/fanroom-board.browser.mjs

      - name: Song catalog browser checks
        timeout-minutes: 5
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/stream-song-catalog.browser.mjs

      - name: Avatar Story browser checks
        timeout-minutes: 3
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
        run: node scripts/avatar-story.browser.mjs

      - name: Provided vote video expiry browser checks
        timeout-minutes: 3
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/provided-vote-video.browser.mjs

      - name: Radio Story browser checks
        timeout-minutes: 3
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/radio-story-20260927.browser.mjs

      - name: September 27 recap and music playlist browser checks
        timeout-minutes: 4
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/radio-20260927.browser.mjs

      - name: September 27 night recap browser checks
        timeout-minutes: 4
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --experimental-strip-types scripts/stream-recap-20260927-night.browser.mjs

      - name: September 29 hourly recap browser checks
        timeout-minutes: 5
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/stream-recap-20260929-night.browser.mjs

      - name: September 30 and October 1 hourly recaps browser checks
        timeout-minutes: 7
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/stream-recap-four-20260930-20261001.browser.mjs

      - name: Radio archive browser checks
        timeout-minutes: 5
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/radio-archive.browser.mjs

      - name: October 8 morning short report browser checks
        timeout-minutes: 3
        env:
          PLAYWRIGHT_MODULE_ROOT: ${{ runner.temp }}/mily-browser-tools/node_modules
          SONG_CATALOG_ARTIFACT_DIR: ${{ runner.temp }}/song-catalog-browser
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/stream-recap-20261008-morning.browser.mjs

      - name: Upload song catalog browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: song-catalog-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/song-catalog-browser/
          if-no-files-found: ignore
          retention-days: 7
