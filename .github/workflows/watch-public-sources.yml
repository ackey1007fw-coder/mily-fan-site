name: Watch public sources

# ENTRY 734 の公開情報（SNS / SHOWROOM / 審査フェーズ / 配信予定 endpoint）を
# 1日1回チェックし、サイト登録値との差分を検出したら Issue で人間に確認を求める。
#
# 重要: このワークフローはリポジトリのデータを自動更新しない。
# commit / push / merge は行わず、Issue と summary の出力だけを行う。

on:
  schedule:
    # 毎日 09:10 JST（= 00:10 UTC）。定刻実行は保証されない。
    # 2026-09-24〜10-07の14回は4:36〜6:07遅延。別時刻の有効性は未確認のため予備は追加しない。
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      check_existing_fingerprint:
        description: "任意: 既存open Issueの8桁fingerprintで重複判定を検証（Issue作成なし）"
        type: string
        required: false
        default: ""
  # 監視ロジック自体を変更したときの動作確認（作業ブランチ限定）
  push:
    branches: ["claude/**"]
    paths:
      - "scripts/watch-public-sources.mjs"
      - "scripts/watch-lib.mjs"
      - ".github/workflows/watch-public-sources.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: watch-public-sources
  cancel-in-progress: false

jobs:
  watch:
    name: Check ENTRY 734 public sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Compare public sources with registered values
        id: watch
        env:
          WATCH_REPORT_PATH: ${{ runner.temp }}/watch-report.md
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/watch-public-sources.mjs

      - name: Find existing open issue for this change
        id: existing
        if: steps.watch.outputs.has-changes == 'true' || inputs.check_existing_fingerprint != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # 外部由来の文字列は shell へ展開しない。fingerprint は16進8桁のみ。
          FINGERPRINT: ${{ inputs.check_existing_fingerprint || steps.watch.outputs.fingerprint }}
          CHECK_EXISTING_FINGERPRINT: ${{ inputs.check_existing_fingerprint }}
        run: |
          set -euo pipefail
          # 手動入力も検証する。検証モードでは公開情報の比較は行うがIssueは作成しない。
          [[ "$FINGERPRINT" =~ ^[0-9a-f]{8}$ ]] || { echo "fingerprint must be 8 lowercase hex digits" >&2; exit 1; }
          # タイトルと本文の両方で指紋を探す。
          # （本文の HTML コメントは環境によって落ちうるため、タイトル側も見る）
          matches=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --label public-source-watch \
            --json number,title,body \
            --limit 50 \
            --jq "[.[] | select((.title + .body) | contains(\"$FINGERPRINT\"))] | length")
          echo "count=$matches" >> "$GITHUB_OUTPUT"
          if [ -n "$CHECK_EXISTING_FINGERPRINT" ]; then
            [ "$matches" -gt 0 ] || { echo "No matching open Issue for dedupe verification" >&2; exit 1; }
            echo "重複判定の検証: fingerprint=$FINGERPRINT / open Issue=$matches 件。検証モードではIssueを作成しません。" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open an issue for human review
        if: inputs.check_existing_fingerprint == '' && steps.watch.outputs.has-changes == 'true' && steps.existing.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_PATH: ${{ runner.temp }}/watch-report.md
          # 固定文字列 + 16進8桁の指紋のみ。外部 HTML 由来の文字列は入らない。
          FINGERPRINT: ${{ steps.watch.outputs.fingerprint }}
        run: |
          set -euo pipefail
          # ラベルが無ければ作る（初回実行時）
          gh label create public-source-watch \
            --repo "$GITHUB_REPOSITORY" \
            --description "ENTRY 734 等の公開情報の変更検知" \
            --color FBCA04 || true
          # 本文はスクリプトが sanitize 済みのファイルから読む（shell へ展開しない）
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "ENTRY 734 公開情報の変更を検出 ($FINGERPRINT)" \
            --label public-source-watch \
            --body-file "$REPORT_PATH"

      - name: Note when issue creation is skipped
        if: (steps.watch.outputs.has-changes == 'true' || inputs.check_existing_fingerprint != '') && steps.existing.outputs.count != '0'
        run: |
          echo "同じ内容の open Issue が既にあるため、新規作成をスキップしました。" >> "$GITHUB_STEP_SUMMARY"
