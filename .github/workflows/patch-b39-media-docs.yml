name: Patch b39 media inventory

on:
  push:
    branches:
      - feat/paton-vote-day-3-story-20260828
    paths:
      - ".github/workflows/patch-b39-media-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Add b39 to the media inventory
        shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; path=Path("docs/MEDIA.md"); source=path.read_text(encoding="utf-8"); marker="## 素材台帳（Fan Room voice / 受領日・source date 2026-08-26）"; heading="## 素材台帳（batch b39 / 受領日・source date 2026-08-28）"; block=Path(".tmp/b39-media-doc.md").read_text(encoding="utf-8"); assert marker in source; assert heading not in source; path.write_text(source.replace(marker, block + "\n" + marker, 1), encoding="utf-8")'
          rm -f .tmp/b39-media-doc.md
          rm -f .github/workflows/patch-b39-media-docs.yml

      - name: Commit the inventory update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Paton vote day 3 Story media"
          git push origin "HEAD:${{ github.ref_name }}"
