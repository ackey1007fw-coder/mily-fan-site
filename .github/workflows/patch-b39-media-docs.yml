name: Patch b39 media inventory

on:
  push:
    branches:
      - feat/paton-vote-day-3-story-20260828
    paths:
      - ".github/workflows/patch-b39-media-docs.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Add b39 to the media inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/MEDIA.md")
          source = path.read_text(encoding="utf-8")
          marker = "## 素材台帳（Fan Room voice / 受領日・source date 2026-08-26）"
          heading = "## 素材台帳（batch b39 / 受領日・source date 2026-08-28）"
          assert marker in source
          assert heading not in source

          block = '''## 素材台帳（batch b39 / 受領日・source date 2026-08-28）

2026-08-28 の本人Instagram Story。フィルターを使ったみりぃが
「パトン投票3日目はここから❣️」と案内し、Story内のリンクステッカーから
CAMPUS GIRLS 2027のPaton投票へつなぐ内容。オーナー提供の縦型動画を、
投票期間中のHOME / Supportにある既存 `PatonVoteGuide` へ掲載する。

Storyの恒久permalinkはないため `Instagram Story` は非リンクlabelとする。
サイトではリンクステッカー自体を再現せず、既存の確認済みPaton本人ページ
`https://paton.jp/event/entrant/11380` へ進むボタンを同じガイド内に置く。
NEWS、Gallery動画一覧、`/stories/`、highlights、events、streamSchedule、
`media.ts`、Activitiesには重複追加しない。投票期間終了後は既存ガイドと一緒に非表示になる。

| ID | 公開ファイル | 内容 | 掲載 |
| --- | --- | --- | --- |
| b39-01 | `gallery/mily-b39-01-paton-vote-day-3-story.mp4` | 「パトン投票3日目はここから❣️」と案内するInstagram Story。512×910 / 20.000秒 / video-only。owner-provided | ✅ HOME + Support のPatonVoteGuide |
| b39-01 poster | `gallery/mily-b39-01-paton-vote-day-3-story-poster.jpg` | 公開MP4の実フレーム。512×910 | ✅ HOME + Support のPatonVoteGuide |

### 元素材の実測

- provenance: `owner-provided`（オーナー提供ファイル。SNSから再取得していない）
- Instagram Story / source date: `2026-08-28` / 恒久permalinkなし
- 元素材は公開ディレクトリ・tracked filesへ含めない
- 4,487,450 bytes / sha256
  `dd4cb4e5c70c6e822ead2f742a72c218c5a70442873b27fe1560747692094f32`
- H.264 High / 512×910 / 30fps / 600 frames / 20.000000秒 / yuv420p
- 音声: HE-AAC / 48kHz / stereo
- 元metadataの `creation_time: 2026-08-27T21:13:51Z` は投稿時刻の根拠には使わない
- 画面内にDM、通知、連絡先、住所、第三者コメントは見当たらない

### 音声の扱い — 削除した

元素材には音声ストリームがあるが、内容・由来・権利者とこのサイトでの再配信権を
確認できないため、公開派生はvideo-only（無音）とした。本人の声・BGM・その他の
音声のいずれかは推測して記録しない。元素材は変更していない。

### 公開MP4 / poster

- MP4: 86,843 bytes / H.264 Constrained Baseline / 512×910 / 30fps /
  600 frames / 20.000000秒 / yuv420p / `has_b_frames` 0 / 音声ストリームなし /
  sha256 `d808b91f9b59a2cab14beae1d797a0bb99ec6a84c82a09ec6f7b4fadc5102e19`
- `+faststart`確認済み（`moov` offset 36 < `mdat` offset 3264）
- metadata除去済み。元の`creation_time`と`Core Media Video / Audio`、chapterは残っていない
- poster: 31,464 bytes / 512×910 JPEG / 公開MP4の実フレーム /
  sha256 `f6771c8ec93470d4c3036b77e66472d01151a91f421f9816642c159fa1802e38`
- posterはEXIF / IPTC / XMP / ICCなし
- crop・scale・引き伸ばし・アップスケール・fps水増し・短縮・テロップ削除なし
- AI生成・AI加工・顔補正・generative fill・outpaintingなし

'''

          path.write_text(source.replace(marker, block + marker, 1), encoding="utf-8")
          PY

          rm -f .github/workflows/patch-b39-media-docs.yml

      - name: Commit the inventory update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: record Paton vote day 3 Story media"
          git push origin "HEAD:${{ github.ref_name }}"
