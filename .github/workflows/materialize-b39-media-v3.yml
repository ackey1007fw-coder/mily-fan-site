name: Materialize b39 media v3

on:
  push:
    branches:
      - feat/paton-vote-day-3-story-20260828
    paths:
      - ".github/workflows/materialize-b39-media-v3.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/paton-vote-day-3-story-20260828

      - name: Reconstruct and validate public media
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null || { sudo apt-get update; sudo apt-get install -y ffmpeg; }
          mkdir -p public/media/gallery docs

          cat \
            .tmp/b39/video.part.00 \
            .tmp/b39/video.part.01 \
            .tmp/b39/video.part.01b \
            .tmp/b39/video.part.02 \
            .tmp/b39/video.part.03 \
            .tmp/b39/video.part.04 \
            | base64 --decode > /tmp/video.mp4.xz
          xz --decompress --stdout /tmp/video.mp4.xz > public/media/gallery/mily-b39-01-paton-vote-day-3-story.mp4

          cat \
            .tmp/b39/poster.part.00 \
            .tmp/b39/poster.part.01 \
            .tmp/b39/poster.part.02 \
            | base64 --decode > /tmp/poster.jpg.xz
          xz --decompress --stdout /tmp/poster.jpg.xz > public/media/gallery/mily-b39-01-paton-vote-day-3-story-poster.jpg

          video="public/media/gallery/mily-b39-01-paton-vote-day-3-story.mp4"
          poster="public/media/gallery/mily-b39-01-paton-vote-day-3-story-poster.jpg"

          video_size="$(stat -c%s "$video")"
          video_sha="$(sha256sum "$video" | cut -d' ' -f1)"
          poster_size="$(stat -c%s "$poster")"
          poster_sha="$(sha256sum "$poster" | cut -d' ' -f1)"

          video_codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$video")"
          video_profile="$(ffprobe -v error -select_streams v:0 -show_entries stream=profile -of default=nw=1:nk=1 "$video")"
          video_width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$video")"
          video_height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$video")"
          video_pix_fmt="$(ffprobe -v error -select_streams v:0 -show_entries stream=pix_fmt -of default=nw=1:nk=1 "$video")"
          video_rate="$(ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of default=nw=1:nk=1 "$video")"
          video_frames="$(ffprobe -v error -select_streams v:0 -show_entries stream=nb_frames -of default=nw=1:nk=1 "$video")"
          video_b_frames="$(ffprobe -v error -select_streams v:0 -show_entries stream=has_b_frames -of default=nw=1:nk=1 "$video")"
          video_duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$video")"
          audio_streams="$(ffprobe -v error -select_streams a -show_entries stream=index -of csv=p=0 "$video" | sed '/^$/d' | wc -l | tr -d ' ')"

          poster_codec="$(ffprobe -v error -select_streams v:0 -show_entries stream=codec_name -of default=nw=1:nk=1 "$poster")"
          poster_width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of default=nw=1:nk=1 "$poster")"
          poster_height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of default=nw=1:nk=1 "$poster")"

          printf 'video bytes=%s sha256=%s codec=%s profile=%s size=%sx%s pix_fmt=%s rate=%s frames=%s b_frames=%s duration=%s audio=%s\n' \
            "$video_size" "$video_sha" "$video_codec" "$video_profile" "$video_width" "$video_height" "$video_pix_fmt" "$video_rate" "$video_frames" "$video_b_frames" "$video_duration" "$audio_streams"
          printf 'poster bytes=%s sha256=%s codec=%s size=%sx%s\n' \
            "$poster_size" "$poster_sha" "$poster_codec" "$poster_width" "$poster_height"

          test "$video_size" = "86843"
          case "$video_sha" in
            d808b91f9b59a2cab14beae1d797a0bb99ec6a84c82a09ec6f7b4fadc5102e19|947eb0d8ae47eb14342239ebd1b5df325fb878a10c6587e0a284e40a2ac04313) ;;
            *) echo "Unexpected video SHA-256: $video_sha" >&2; exit 1 ;;
          esac
          test "$video_codec" = "h264"
          test "$video_profile" = "Constrained Baseline"
          test "$video_width" = "512"
          test "$video_height" = "910"
          test "$video_pix_fmt" = "yuv420p"
          test "$video_rate" = "30/1"
          test "$video_frames" = "600"
          test "$video_b_frames" = "0"
          test "$video_duration" = "20.000000"
          test "$audio_streams" = "0"

          test "$poster_size" = "31531"
          test "$poster_sha" = "bf182e028c3205f78675751970f65c686fc3281012fc2cac0d857cdc01349304"
          test "$poster_codec" = "mjpeg"
          test "$poster_width" = "512"
          test "$poster_height" = "910"

          python - "$video" <<'PY'
          from pathlib import Path
          import sys

          data = Path(sys.argv[1]).read_bytes()
          moov = data.find(b"moov")
          mdat = data.find(b"mdat")
          assert moov >= 0 and mdat >= 0 and moov < mdat, (moov, mdat)
          assert b"creation_time" not in data
          PY

          cat > docs/MEDIA-B39-PATON-VOTE-DAY-3-STORY.md <<EOF
          # 2026-08-28 Instagram Story「パトン投票3日目」動画（batch b39）

          ## 公開ファイル

          - 動画: \`/media/gallery/mily-b39-01-paton-vote-day-3-story.mp4\`
            - bytes: \`${video_size}\`
            - SHA-256: \`${video_sha}\`
          - ポスター: \`/media/gallery/mily-b39-01-paton-vote-day-3-story-poster.jpg\`
            - bytes: \`${poster_size}\`
            - SHA-256: \`${poster_sha}\`

          ## 掲載範囲

          - HOME / Support の投票期間中に表示される \`PatonVoteGuide\` 内で再生する。
          - 同じカードの確認済みPaton投票CTAからENTRY 734へ進める。
          - NEWS、Gallery動画一覧、\`/stories/\`、Highlight、events、streamSchedule、\`media.ts\` には重複登録しない。
          - 恒久的なStory permalinkがないため \`sourceLabel: Instagram Story\` と \`sourceDate: 2026-08-28\` のみを保持し、\`sourceUrl\` は付けない。

          ## 公開処理

          - 本人提供の20秒縦動画から音声と受け渡し時メタデータを除去した公開版。
          - H.264 Constrained Baseline / yuv420p / 512×910 / 30fps / 600frames / B-frame 0 / faststart。
          - トリミング・拡大は行わず、元の画角と長さを維持した。
          - ポスターは実動画の8秒地点のフレームを使用し、メタデータを除去した。
          - Story内のリンクスタンプは自己ホスト後に押せないため、同じ案内カードの投票ボタンを利用する。
          EOF

          rm -rf .tmp/b39
          rm -f .github/workflows/materialize-b39-media.yml
          rm -f .github/workflows/materialize-b39-media-v2.yml
          rm -f .github/workflows/materialize-b39-media-v3.yml

      - name: Commit validated media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add Paton day 3 Story media"
          git push origin HEAD:feat/paton-vote-day-3-story-20260828
