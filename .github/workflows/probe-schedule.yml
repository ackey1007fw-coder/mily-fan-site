name: Probe stream schedule

# 配信予定の自動解決（ENTRY 734 → SHOWROOM → schedule JSON）を
# 実ネットワークで検証するための手動/ブランチ限定ワークフロー。
# サイトのビルドやデプロイには関与しない。

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "検証するデプロイURL（Vercel Preview 等）。空なら HTTP契約の検証をスキップ"
        required: false
        default: ""
  push:
    branches: ["claude/**"]
    paths:
      - "api/mily-schedule.js"
      - "api/mily-live.js"
      - "server/mily-showroom.js"
      - "scripts/probe-schedule.mjs"
      - "scripts/probe-live.mjs"
      - ".github/workflows/probe-schedule.yml"

permissions:
  contents: read

jobs:
  probe:
    name: Resolve schedule from entry page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run probe
        run: node scripts/probe-schedule.mjs

      - name: Probe live + radio chain
        run: node --disable-warning=ExperimentalWarning --experimental-strip-types scripts/probe-live.mjs

      # デプロイ済み Function の HTTP 契約（GET/OPTIONS のみ・405・Allow・短命キャッシュ）。
      # URL は入力なので shell へ直接展開せず、環境変数経由で渡す。
      - name: Verify deployed HTTP contract
        if: inputs.deployment_url != ''
        env:
          DEPLOYMENT_URL: ${{ inputs.deployment_url }}
        run: |
          set -euo pipefail
          for path in /api/mily-live /api/mily-radio-status; do
            echo "--- ${path} ---"
            get_code=$(curl -sS -o /dev/null -w '%{http_code}' -X GET "${DEPLOYMENT_URL}${path}")
            if [ "${get_code}" != "200" ]; then
              # Vercel Deployment Protection 等で 401/302 になる URL は検証対象外。
              echo "GET ${get_code}: 公開されていないURLのため契約検証をスキップ"
              continue
            fi
            curl -sS -D - -o /dev/null -X GET "${DEPLOYMENT_URL}${path}" \
              | grep -iE '^(HTTP/|cache-control|allow)'
            echo "(POST should be 405)"
            curl -sS -D - -o /dev/null -X POST "${DEPLOYMENT_URL}${path}" \
              | grep -iE '^(HTTP/|allow)'
            post_code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "${DEPLOYMENT_URL}${path}")
            test "${post_code}" = "405"
          done
